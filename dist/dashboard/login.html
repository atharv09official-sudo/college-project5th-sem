<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In • SupplyGuard AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/login-UulwwnW1.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/smooth-toast-2nWdVltP.js">
  <link rel="modulepreload" crossorigin href="/assets/map-fast-BOPcN3hr.js">
  <link rel="modulepreload" crossorigin href="/assets/app-Btji-69o.js">
  <link rel="stylesheet" crossorigin href="/assets/flowgrid-B3C_C16G.css">
  <link rel="stylesheet" crossorigin href="/assets/styles-SfqUW_C2.css">
</head>

<body
    class="text-gray-100 min-h-screen flex items-center justify-end px-4 md:px-20 lg:px-32 bg-cover bg-center bg-no-repeat"
    style="background-image: url('/assets/login-login-aAntASck.jpg');">
    <!-- Overlay for better readability -->
    <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px]"></div>
    
    <div class="absolute inset-0 pointer-events-none">
        <!-- Decoration if needed, but background image usually enough -->
    </div>

    <main class="relative z-10 w-full max-w-md bg-black/60 backdrop-blur-xl p-8 rounded-2xl border border-white/10 shadow-2xl">
        <div class="mb-8 text-center">
            <h1 class="text-2xl font-semibold mt-4">Welcome back</h1>
            <p class="text-sm text-gray-300 mt-1">Sign in to review your routes and risk dashboards.</p>
        </div>

        <section class="">
            <form id="login-form" class="space-y-4" aria-label="Login form">
                <div class="flex items-center justify-between text-xs text-gray-400 mb-2">
                    <span class="inline-flex items-center gap-1">
                        <svg class="w-3 h-3 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 11c0 1.657-1.343 3-3 3S6 12.657 6 11s1.343-3 3-3 3 1.343 3 3z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19.5 11.5a4.5 4.5 0 11-8.188-2.435L12 5.5l1.688 3.565A4.5 4.5 0 0119.5 11.5z">
                            </path>
                        </svg>
                        Secure login
                    </span>
                    <span>Your data stays in your environment.</span>
                </div>

                <div>
                    <label for="email" class="block text-xs font-medium text-gray-400 mb-1">Work Email</label>
                    <input id="email" name="email" type="email" required autocomplete="email"
                        class="w-full px-3 py-2 rounded-lg bg-black/30 border border-white/10 focus:border-indigo-500 focus:outline-none text-sm"
                        placeholder="name@company.com">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label for="password" class="block text-xs font-medium text-gray-400">Password</label>
                        <a href="#" class="text-xs text-indigo-300 hover:text-indigo-200">Forgot password?</a>
                    </div>
                    <input id="password" name="password" type="password" required autocomplete="current-password"
                        class="w-full px-3 py-2 rounded-lg bg-black/30 border border-white/10 focus:border-indigo-500 focus:outline-none text-sm"
                        placeholder="••••••••">
                </div>

                <div class="flex items-center justify-between text-xs text-gray-400">
                    <label class="inline-flex items-center gap-2">
                        <input type="checkbox"
                            class="rounded border-white/20 bg-black/20 text-indigo-500 focus:ring-indigo-500">
                        <span>Remember me on this device</span>
                    </label>
                </div>

                <button type="submit"
                    class="w-full mt-2 inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-sm font-semibold rounded-lg shadow-lg shadow-indigo-500/20 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7">
                        </path>
                    </svg>
                    Log In
                </button>
            </form>

                <p class="mt-4 text-xs text-gray-400 text-center">
                Don’t have an account?
                <a href="/signup" class="text-indigo-300 hover:text-indigo-200 font-medium">Create one</a>
            </p>
        </section>

        <p class="mt-4 text-[11px] text-gray-500 text-center max-w-sm mx-auto">
            Secure Session Management Enabled.
        </p>
    </main>

</body>

</html>
