<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account • SupplyGuard AI</title>
  <script type="module" crossorigin src="/assets/signup-B0Z8vgfQ.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/smooth-toast-2nWdVltP.js">
  <link rel="modulepreload" crossorigin href="/assets/map-fast-BOPcN3hr.js">
  <link rel="modulepreload" crossorigin href="/assets/app-Btji-69o.js">
  <link rel="stylesheet" crossorigin href="/assets/flowgrid-BK_7M6GC.css">
  <link rel="stylesheet" crossorigin href="/assets/styles-CvZ3AnkW.css">
</head>

<body
    class="text-gray-100 min-h-screen flex items-center justify-end px-4 md:px-20 lg:px-32 bg-cover bg-center bg-no-repeat"
    style="background-image: url('/assets/login-login-aAntASck.jpg');">
    <!-- Overlay for better readability -->
    <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px]"></div>
    
    <div class="absolute inset-0 pointer-events-none">
        <!-- Decoration if needed, but background image usually enough -->
    </div>

    <main class="relative z-10 w-full max-w-md bg-black/60 backdrop-blur-xl p-8 rounded-2xl border border-white/10 shadow-2xl">
        <div class="mb-8 text-center">
            <h1 class="text-2xl font-semibold mt-4">Create account</h1>
            <p class="text-sm text-gray-300 mt-1">Start with sample data, then connect your own routes later.</p>
        </div>

        <section class="">
            <form id="signup-form" class="space-y-4" aria-label="Signup form">
                <div>
                    <label for="full-name" class="block text-xs font-medium text-gray-400 mb-1">Full Name</label>
                    <input id="full-name" name="name" type="text" required
                        class="w-full px-3 py-2 rounded-lg bg-black/30 border border-white/10 focus:border-indigo-500 focus:outline-none text-sm"
                        placeholder="System User">
                </div>

                <div>
                    <label for="signup-email" class="block text-xs font-medium text-gray-400 mb-1">Work Email</label>
                    <input id="signup-email" name="email" type="email" required autocomplete="email"
                        class="w-full px-3 py-2 rounded-lg bg-black/30 border border-white/10 focus:border-indigo-500 focus:outline-none text-sm"
                        placeholder="name@company.com">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="company" class="block text-xs font-medium text-gray-400 mb-1">Company
                            (optional)</label>
                        <input id="company" name="company" type="text"
                            class="w-full px-3 py-2 rounded-lg bg-black/30 border border-white/10 focus:border-indigo-500 focus:outline-none text-sm"
                            placeholder="Acme Logistics">
                    </div>
                    <div>
                        <label for="role" class="block text-xs font-medium text-gray-400 mb-1">Role (optional)</label>
                        <select id="role" name="role"
                            class="w-full px-3 py-2 rounded-lg bg-black/30 border border-white/10 focus:border-indigo-500 focus:outline-none text-sm">
                            <option value="">Select role</option>
                            <option>Logistics manager</option>
                            <option>Supply chain planner</option>
                            <option>Risk analyst</option>
                            <option>Operations leader</option>
                            <option>Other</option>
                        </select>
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label for="signup-password" class="block text-xs font-medium text-gray-400">Password</label>
                        <span class="text-[11px] text-gray-500">8+ characters, at least one number</span>
                    </div>
                    <input id="signup-password" name="password" type="password" required autocomplete="new-password"
                        class="w-full px-3 py-2 rounded-lg bg-black/30 border border-white/10 focus:border-indigo-500 focus:outline-none text-sm"
                        placeholder="Create a secure password">
                </div>

                <div class="flex items-center gap-2 text-[11px] text-gray-500">
                    <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
                    <span>Password is securely hashed and stored.</span>
                </div>

                <button type="submit"
                    class="w-full mt-2 inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-sm font-semibold rounded-lg shadow-lg shadow-indigo-500/20 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 11a4 4 0 100-8 4 4 0 000 8z"></path>
                    </svg>
                    Create Account
                </button>

                <p class="mt-3 text-[11px] text-gray-500">
                    By signing up, you agree to our <a href="#" class="underline underline-offset-2">Terms</a> and
                    <a href="#" class="underline underline-offset-2">Privacy Policy</a>.
                </p>
            </form>

            <p class="mt-4 text-xs text-gray-400 text-center">
                Already have an account?
                <a href="/login" class="text-indigo-300 hover:text-indigo-200 font-medium">Log in</a>
            </p>
        </section>

        <p class="mt-4 text-[11px] text-gray-500 text-center max-w-sm mx-auto">
            Secure Session Management Enabled.
        </p>
    </main>

</body>

</html>
