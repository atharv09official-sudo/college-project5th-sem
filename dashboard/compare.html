    <div

            <span class="text-gray-500">Dashboard</span>

            <span class="text-gray-500">Routes</span>

    </div>

    <!-- Main Content -->
    <main class="flex-grow p-6 overflow-y-auto bg-dark-bg flex gap-6">
        <!-- Routes Column -->
        <div class="flex-1 max-w-7xl mx-auto">
            <!-- Comparison Controls -->
            <div class="glass-panel rounded-xl p-6 mb-8 border border-white/5">
                <div class="flex flex-col md:flex-row items-end gap-4">
                    <div class="flex-1 w-full">
                        <label class="block text-xs text-gray-400 mb-2 uppercase font-bold tracking-wider">Origin Country</label>
                        <!-- Custom Dropdown: Origin -->
                        <div class="relative" id="origin-dropdown">
                            <button type="button" class="w-full bg-black/20 border border-white/10 rounded-lg px-4 py-2.5 text-white text-left flex justify-between items-center focus:outline-none focus:border-indigo-500 transition-colors">
                                <span class="selected-text truncate">India</span>
                                <svg class="w-4 h-4 text-gray-500 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div class="hidden absolute z-50 w-full mt-1 bg-[#121214] border border-white/10 rounded-lg shadow-xl shadow-black/50 backdrop-blur-xl overflow-hidden transform origin-top transition-all">
                                <div class="p-2 border-b border-white/5 sticky top-0 bg-[#121214] z-10">
                                    <input type="text" class="w-full bg-white/5 border border-white/10 rounded px-2 py-1.5 text-xs text-gray-200 focus:outline-none focus:border-indigo-500/50" placeholder="Search country...">

                                <div class="max-h-60 overflow-y-auto custom-scrollbar p-1 options-list">

                    </div>
                    <div class="hidden md:flex items-center justify-center pb-3 text-gray-500">

                    </div>
                    <div class="flex-1 w-full">
                        <label class="block text-xs text-gray-400 mb-2 uppercase font-bold tracking-wider">Destination Country</label>
                        <!-- Custom Dropdown: Destination -->
                        <div class="relative" id="dest-dropdown">
                            <button type="button" class="w-full bg-black/20 border border-white/10 rounded-lg px-4 py-2.5 text-white text-left flex justify-between items-center focus:outline-none focus:border-indigo-500 transition-colors">
                                <span class="selected-text truncate">Netherlands</span>
                                <svg class="w-4 h-4 text-gray-500 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div class="hidden absolute z-50 w-full mt-1 bg-[#121214] border border-white/10 rounded-lg shadow-xl shadow-black/50 backdrop-blur-xl overflow-hidden transform origin-top transition-all">

                                    <input type="text" class="w-full bg-white/5 border border-white/10 rounded px-2 py-1.5 text-xs text-gray-200 focus:outline-none focus:border-indigo-500/50" placeholder="Search country...">

                                <div class="max-h-60 overflow-y-auto custom-scrollbar p-1 options-list">

                        </div>

                    <button id="btn-compare" class="w-full md:w-auto px-8 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg shadow-lg shadow-indigo-900/20 transition-all flex items-center justify-center gap-2">
                        <span>Analyze Routes</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>

            <div class="mb-8">

                <p class="text-sm text-gray-400">Comparing viable trade routes from <span id="origin-label" class="text-white font-bold">...</span> to <span id="dest-label" class="text-white font-bold">...</span></p>
            </div>

            <div id="routes-container" class="space-y-8">
                <!-- Grouped Sections (Sea, Air, Road) will be injected here -->

        <!-- AI Suggestions Sidebar -->

                    <span class="text-lg">🧠</span>
                    <h3 class="font-bold text-white">AI Suggestions</h3>

                <div id="ai-suggestions-list" class="space-y-3">

                </div>
            </div>

    <script type="module">
        import { UI } from '/src/js/ui.js';
        import { SmoothToast } from '/src/js/smooth-toast.js';
        import { getCountryCode, getCountryFlagHtml } from '/src/js/country-flags.js';

        // Make SmoothToast available globally if needed
        window.SmoothToast = SmoothToast;

        let btnClass = '';

        // --- Helpers ---
        function getRiskColor(score) {
            if (score >= 7) return 'text-red-400';
            if (score >= 4) return 'text-yellow-400';
            return 'text-emerald-400';
        }

        function getRiskBarColor(score) {
            if (score >= 7) return 'bg-red-400';
            if (score >= 4) return 'bg-yellow-400';
            return 'bg-emerald-400';
        }

        function getCostSigns(index) {
            return '$'.repeat(index);
        }

        function renderRouteCard(route, isRecommended, reasoning) {
            const riskColor = getRiskColor(route.risk_score);
            const barColor = getRiskBarColor(route.risk_score);
            const borderClass = isRecommended ? 'border-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.15)]' : 'border-white/5 hover:border-white/10';
            const bgClass = isRecommended ? 'bg-emerald-900/10' : '';

            let feasibilityWarning = '';
            if (route.feasibility === 'Limited') {
                feasibilityWarning = `
                    <div class="mt-3 p-2 rounded bg-red-500/10 border border-red-500/20 text-xs text-red-300 flex gap-2 items-start">
                        <span>⚠️</span>
                        <div>
                            <span class="font-bold">Limited Feasibility:</span> ${route.feasibility_reason}
                        </div>
                    </div>
                `;
            }

            let recommendationBadge = '';
            let reasoningText = '';
            let btnClass = 'bg-white/5 hover:bg-white/10 text-gray-300';
            let btnText = 'Select this Route';

            if (isRecommended) {
                recommendationBadge = `
                    <div class="absolute -top-3 right-4 px-3 py-1 bg-emerald-600 text-white text-[10px] uppercase font-bold tracking-wider rounded-full shadow-lg border border-emerald-400">
                        AI Recommended
                    </div>
                `;
                reasoningText = `
                    <div class="mb-4 text-xs text-emerald-300 font-medium bg-emerald-500/10 p-2 rounded border border-emerald-500/20">
                        ✨ ${reasoning}
                    </div>
                `;
                btnClass = 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-900/50';
            }

            return `
                <div class="glass-panel rounded-xl p-6 border ${borderClass} relative transition-all duration-300 ${bgClass}">
                    ${recommendationBadge}
                    
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-lg font-bold text-white">${route.name}</h3>
                            <p class="text-xs text-gray-400">${route.details}</p>
                        </div>
                        <div class="text-right">
                             <div class="text-xs text-gray-500 uppercase font-bold tracking-wider mb-1">Risk Score</div>
                             <div class="text-2xl font-bold ${riskColor}">${route.risk_score}</div>
                        </div>
                    </div>

                    ${reasoningText}

                    <!-- Risk Bar -->
                    <div class="w-full bg-gray-800 rounded-full h-1.5 mb-6 overflow-hidden">
                        <div class="${barColor} h-full rounded-full" style="width: ${route.risk_score * 10}%"></div>
                    </div>

                    <!-- Stats Grid -->
                    <div class="grid grid-cols-2 gap-4 mb-6 text-sm">
                        <div class="p-3 rounded-lg bg-black/20 border border-white/5">
                            <div class="text-gray-500 text-xs mb-1">Transit Time</div>
                            <div class="text-white font-mono font-medium">${route.transit_time} Days</div>
                        </div>
                        <div class="p-3 rounded-lg bg-black/20 border border-white/5">
                            <div class="text-gray-500 text-xs mb-1">Cost Index</div>
                            <div class="text-white font-mono font-medium tracking-widest text-xs" title="$${route.cost_usd}">${getCostSigns(route.cost_index)}</div>
                        </div>
                        <div class="p-3 rounded-lg bg-black/20 border border-white/5">
                            <div class="text-gray-500 text-xs mb-1">Primary Risk</div>
                            <div class="text-white font-medium truncate" title="${route.primary_risk}">${route.primary_risk}</div>
                        </div>
                        <div class="p-3 rounded-lg bg-black/20 border border-white/5">
                            <div class="text-gray-500 text-xs mb-1">Reliability</div>
                            <div class="${route.reliability.includes('High') ? 'text-emerald-400' : 'text-yellow-400'} font-medium">${route.reliability}</div>
                        </div>
                    </div>

                    ${feasibilityWarning}

                    <div class="mt-4 pt-4 border-t border-white/5">
                        <button onclick="selectRoute('${route.id}')" class="w-full py-2.5 rounded-lg text-sm font-medium transition ${btnClass}">
                            ${btnText}
                        </button>
                    </div>
                </div>
            `;
        }

        async function initDropdown(containerId, initialOptions, onSelect) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const button = container.querySelector('button');
            const menuDiv = container.querySelector('div.absolute'); // The dropdown menu container
            const searchInput = menuDiv.querySelector('input');
            const listDiv = menuDiv.querySelector('.options-list');
            const selectedText = button.querySelector('.selected-text');
            const hiddenInput = container.querySelector('input[type="hidden"]');

            let currentOptions = initialOptions || [];

            // Toggle
            button.addEventListener('click', (e) => {
                e.stopPropagation();
                // Close others
                document.querySelectorAll('[id$="-dropdown"] div.absolute').forEach(el => {
                    if (el !== menuDiv) el.classList.add('hidden');
                });
                menuDiv.classList.toggle('hidden');
                if (!menuDiv.classList.contains('hidden')) {
                    searchInput.value = ''; // Clear search on open
                    renderOptions(''); // Reset list
                    searchInput.focus();
                }
            });

            // Populate Options
            const renderOptions = (filter = '') => {
                listDiv.innerHTML = '';
                const filtered = currentOptions.filter(o => o.toLowerCase().includes(filter.toLowerCase()));
                
                if (filtered.length === 0) {
                    listDiv.innerHTML = '<div class="px-3 py-2 text-xs text-gray-500 text-center">No results found</div>';
                    return;
                }

                filtered.forEach(opt => {
                    const div = document.createElement('div');
                    div.className = 'px-3 py-2 text-sm text-gray-300 hover:bg-white/10 hover:text-white cursor-pointer rounded transition-colors flex items-center gap-2';
                    const flag = getCountryCode(opt) ? getCountryFlagHtml(opt) : '';
                    div.innerHTML = `${flag}<span class="truncate">${opt}</span>`;
                    
                    div.addEventListener('click', () => {
                        selectedText.innerHTML = `${flag}<span class="align-middle">${opt}</span>`;
                        selectedText.classList.remove('text-gray-400'); // If it was placeholder style
                        selectedText.classList.add('text-white');
                        hiddenInput.value = opt;
                        menuDiv.classList.add('hidden');
                        if (onSelect) onSelect(opt);
                    });
                    listDiv.appendChild(div);
                });
            };

            // Search Listener
            searchInput.addEventListener('input', (e) => {
                renderOptions(e.target.value);
            });
            
            // Prevent menu close when clicking input
            searchInput.addEventListener('click', (e) => e.stopPropagation());

            // Global Click to Close
            document.addEventListener('click', (e) => {
                if (!container.contains(e.target)) {
                    menuDiv.classList.add('hidden');
                }
            });
        }

        async function initCountries() {
            try {
                const res = await fetch('/api/countries');
                const countries = await res.json();
                
                if (!Array.isArray(countries)) return;

                // Sort
                countries.sort();

                // Initialize Custom Dropdowns
                initDropdown('origin-dropdown', countries);
                initDropdown('dest-dropdown', countries);

                // Set initial flag icons on defaults
                const originBtn = document.querySelector('#origin-dropdown .selected-text');
                if (originBtn && originBtn.textContent.trim()) {
                    originBtn.innerHTML = `${getCountryFlagHtml(originBtn.textContent.trim())}<span class="align-middle">${originBtn.textContent.trim()}</span>`;
                }
                const destBtn = document.querySelector('#dest-dropdown .selected-text');
                if (destBtn && destBtn.textContent.trim()) {
                    destBtn.innerHTML = `${getCountryFlagHtml(destBtn.textContent.trim())}<span class="align-middle">${destBtn.textContent.trim()}</span>`;
                }

            } catch (err) {
                console.error("Failed to load countries", err);
                SmoothToast.error("Could not load country list.");
            }
        }

        async function fetchAndRender() {
            const origin = document.getElementById('origin-country').value;
            const destination = document.getElementById('dest-country').value;
            const btn = document.getElementById('btn-compare');
            
            // UI Loading State
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Analyzing...`;
            btn.disabled = true;

            const container = document.getElementById('routes-container');
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center h-64">
                    <div class="text-indigo-400 animate-pulse text-lg font-medium">Analyzing global logistics networks...</div>
                    <div class="text-gray-500 text-xs mt-2">Calculating risk, cost, and transit times</div>
                </div>
            `;

            try {
                const res = await fetch(`/api/route-options?from=${encodeURIComponent(origin)}&to=${encodeURIComponent(destination)}`);
                if (!res.ok) throw new Error("Failed to fetch route data");
                
                const data = await res.json();

                // Update Header
                document.getElementById('origin-label').textContent = data.origin;
                document.getElementById('dest-label').textContent = data.destination;

                // Render Suggestions
                const suggestionsContainer = document.getElementById('ai-suggestions-list');
                suggestionsContainer.innerHTML = data.ai_suggestions.map(s => `
                    <div class="p-3 rounded-lg bg-indigo-500/10 border border-indigo-500/20 text-xs text-indigo-200">
                        ${s}
                    </div>
                `).join('');

                // Group Routes
                const groups = {
                    'Sea': [],
                    'Air': [],
                    'Road': []
                };

                data.routes.forEach(r => {
                    // Match backend "Air", "Sea", "Road" to groups
                    // Backend returns capitalized "Air", "Sea", "Road"
                    if (groups[r.mode]) groups[r.mode].push(r);
                });

                // Render Groups
                container.innerHTML = '';
                const modeIcons = { 'Sea': '🚢', 'Air': '✈️', 'Road': '🚚' };
                let hasRoutes = false;

                for (const [mode, routes] of Object.entries(groups)) {
                    if (routes.length === 0) continue;
                    hasRoutes = true;

                    const groupHtml = `
                        <div class="animate-fade-in-up">
                            <div class="flex items-center gap-2 mb-4 px-1">
                                <span class="text-xl">${modeIcons[mode]}</span>
                                <h2 class="text-lg font-bold text-white uppercase tracking-wide">${mode} Routes</h2>
                                <div class="h-px bg-white/10 flex-grow ml-4"></div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                ${routes.map(r => renderRouteCard(r, r.id === data.recommendation.id, data.recommendation.reasoning)).join('')}
                            </div>
                        </div>
                    `;
                    container.innerHTML += groupHtml;
                }
                
                if (!hasRoutes) {
                     container.innerHTML = `
                        <div class="text-center py-12 text-gray-400">
                            No viable routes found between these locations.
                        </div>
                    `;
                }

                SmoothToast.success("Analysis complete");

            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="text-center py-12 text-red-400">
                        Failed to load comparison data. Please try again.
                    </div>
                `;
                SmoothToast.error("Analysis failed");
            } finally {
                btn.innerHTML = originalBtnText;
                btn.disabled = false;
            }
        }

        window.selectRoute = function(id) {
            console.log('Selected route:', id);
            SmoothToast.success(`Route selected! Redirecting to planner...`);
            // Optional: Redirect to planner
            // setTimeout(() => window.location.href = '/shipment-planner', 1000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize UI components
            UI.initProfileMenu();
            UI.initSession();
            UI.initTheme();

            initCountries();
            
            document.getElementById('btn-compare').addEventListener('click', fetchAndRender);
            
            // Initial load
            fetchAndRender();
        });
    </script>
</body>

</html>
