<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner - SupplyGuard AI</title>
    <link rel="stylesheet" href="/src/css/flowgrid.css">
    <link href="/src/css/styles.css" rel="stylesheet">
    </head>

<body class="bg-dark-bg text-gray-100 h-screen overflow-hidden flex flex-col">

    <!-- Top Bar -->
    <nav class="glass-panel z-50 px-6 h-16 flex items-center justify-between border-b border-white/10 shrink-0">
        <div class="flex items-center gap-4">
            <a href="/dashboard" class="flex items-center gap-2 text-gray-400 hover:text-white transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </a>
            <div class="h-6 w-px bg-white/10"></div>
            <h1 class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-cyan-400 glow-text">
                Logistics Command Center
            </h1>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 mr-2 border-r border-white/10 pr-4">
                <div class="text-xs text-gray-500 font-mono">SYS.STATUS: <span class="text-emerald-400">ONLINE</span></div>
                <div class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse-glow"></div>
            </div>
            
            <div class="relative">
                <button id="profile-menu-btn" class="flex items-center gap-2 md:gap-3 px-2 py-1 rounded-lg hover:bg-white/10 text-sm focus:outline-none">
                    <div class="text-right hidden sm:block">
                        <div class="text-xs font-medium text-gray-100">System User</div>
                        <div class="flex items-center justify-end gap-1">
                            <span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-300 border border-emerald-400/20">Admin</span>
                        </div>
                    </div>
                    <div class="h-8 w-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 border border-white/20"></div>
                </button>
                <div id="profile-menu-dropdown" class="hidden absolute right-0 top-full mt-2 w-56 bg-[#121214] border border-white/10 rounded-lg shadow-lg shadow-black/50 backdrop-blur-xl p-1 z-50 text-gray-200 transform origin-top-right transition-all">
                    <div class="px-2 py-1.5 border-b border-white/5 mb-1">
                        <p class="text-sm font-medium text-gray-100">System User</p>
                        <p class="text-xs text-gray-400 truncate">system@supplyguard.ai</p>
                    </div>
                    <div class="space-y-0.5">
                        <a href="/settings#profile" class="relative flex items-center gap-2 px-2 py-1.5 text-sm rounded-md hover:bg-white/5 hover:text-white transition-colors cursor-pointer outline-none group">
                            <svg class="w-4 h-4 text-gray-400 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            <span>Profile</span>
                            <span class="ml-auto text-xs text-gray-500">⇧⌘P</span>
                        </a>
                        <a href="/settings#users" class="relative flex items-center gap-2 px-2 py-1.5 text-sm rounded-md hover:bg-white/5 hover:text-white transition-colors cursor-pointer outline-none group">
                            <svg class="w-4 h-4 text-gray-400 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                            <span>Team</span>
                        </a>
                        <a href="/settings" class="relative flex items-center gap-2 px-2 py-1.5 text-sm rounded-md hover:bg-white/5 hover:text-white transition-colors cursor-pointer outline-none group">
                            <svg class="w-4 h-4 text-gray-400 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            <span>Settings</span>
                            <span class="ml-auto text-xs text-gray-500">⌘S</span>
                        </a>
                    </div>
                    <div class="h-px bg-white/5 my-1 mx-1"></div>
                    <button id="btn-logout" class="w-full relative flex items-center gap-2 px-2 py-1.5 text-sm rounded-md text-red-400 hover:bg-red-500/10 hover:text-red-300 transition-colors cursor-pointer outline-none group text-left">
                        <svg class="w-4 h-4 text-red-400/70 group-hover:text-red-300 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                        <span>Log out</span>
                        <span class="ml-auto text-xs text-red-400/50">⇧⌘Q</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Command Grid -->
    <main class="flex-grow p-6 grid grid-cols-12 gap-6 overflow-hidden relative">
        
        <!-- Ambient Background -->
        <div class="absolute inset-0 overflow-hidden -z-10 pointer-events-none">
            <div class="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-indigo-900/10 to-transparent"></div>
            <div class="absolute bottom-0 right-0 w-96 h-96 bg-purple-500/5 rounded-full blur-3xl"></div>
        </div>

        <!-- LEFT PANEL: Mission Control (3 Cols) -->
        <div class="col-span-3 flex flex-col gap-6 h-full overflow-y-auto pr-2 custom-scrollbar">
            
            <!-- Mode Selector -->
            <div class="glass-panel p-5 rounded-xl border-l-4 border-l-indigo-500">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">1. Transport Vector</h3>
                <div class="grid grid-cols-1 gap-3">
                    <label class="cursor-pointer group relative">
                        <input type="radio" name="mode" value="sea" checked class="peer hidden">
                        <div class="p-3 rounded-lg bg-white/5 border border-white/10 peer-checked:bg-indigo-500/20 peer-checked:border-indigo-500 peer-checked:glow-border-blue hover:bg-white/10 transition flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-black/30 flex items-center justify-center text-xl">🚢</div>
                            <div>
                                <div class="text-sm font-bold text-gray-200 group-hover:text-white">Sea Freight</div>
                                <div class="text-[10px] text-gray-500">Standard Container</div>
                            </div>
                        </div>
                    </label>
                    <label class="cursor-pointer group relative">
                        <input type="radio" name="mode" value="air" class="peer hidden">
                        <div class="p-3 rounded-lg bg-white/5 border border-white/10 peer-checked:bg-cyan-500/20 peer-checked:border-cyan-500 peer-checked:glow-border-blue hover:bg-white/10 transition flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-black/30 flex items-center justify-center text-xl">✈️</div>
                            <div>
                                <div class="text-sm font-bold text-gray-200 group-hover:text-white">Air Cargo</div>
                                <div class="text-[10px] text-gray-500">Express Delivery</div>
                            </div>
                        </div>
                    </label>
                    <label class="cursor-pointer group relative">
                        <input type="radio" name="mode" value="road" class="peer hidden">
                        <div class="p-3 rounded-lg bg-white/5 border border-white/10 peer-checked:bg-orange-500/20 peer-checked:border-orange-500 peer-checked:glow-border-blue hover:bg-white/10 transition flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-black/30 flex items-center justify-center text-xl">🚛</div>
                            <div>
                                <div class="text-sm font-bold text-gray-200 group-hover:text-white">Road Network</div>
                                <div class="text-[10px] text-gray-500">Regional Transit</div>
                            </div>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Route Config -->
            <div class="glass-panel p-5 rounded-xl border-l-4 border-l-purple-500 flex-grow">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">2. Route Coordinates</h3>
                
                <div class="space-y-5">
                    <div class="relative group">
                        <div class="absolute -left-[21px] top-2 w-2 h-2 rounded-full bg-indigo-500 ring-4 ring-black"></div>
                        <label class="block text-[10px] font-semibold text-indigo-400 uppercase mb-1">Origin Point</label>
                        
                        <!-- Custom Dropdown: Origin -->
                        <div class="relative mb-2" id="origin-dropdown">
                            <button type="button" class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white text-left flex justify-between items-center focus:outline-none focus:border-indigo-500 focus:glow-border-blue transition group-hover:border-white/20">
                                <span class="selected-text truncate">Select Country...</span>
                                <svg class="w-4 h-4 text-gray-500 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div class="hidden absolute z-50 w-full mt-1 bg-[#121214] border border-white/10 rounded-lg shadow-xl shadow-black/50 backdrop-blur-xl overflow-hidden transform origin-top transition-all">
                                <div class="p-2 border-b border-white/5 sticky top-0 bg-[#121214] z-10">
                                    <input type="text" class="w-full bg-white/5 border border-white/10 rounded px-2 py-1.5 text-xs text-gray-200 focus:outline-none focus:border-indigo-500/50" placeholder="Search country...">
                                </div>
                                <div class="max-h-48 overflow-y-auto custom-scrollbar p-1 options-list">
                                    <!-- Options populated by JS -->
                                </div>
                            </div>
                            <input type="hidden" id="origin-country" value="">
                        </div>

                        <!-- Custom Dropdown: Origin Port -->
                        <div class="relative mb-2" id="origin-port-dropdown">
                            <button type="button" class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-gray-400 text-left flex justify-between items-center focus:outline-none focus:border-indigo-500 transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                                <span class="selected-text truncate">Select Port/Hub...</span>
                                <svg class="w-4 h-4 text-gray-500 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div class="hidden absolute z-50 w-full mt-1 bg-[#121214] border border-white/10 rounded-lg shadow-xl shadow-black/50 backdrop-blur-xl overflow-hidden transform origin-top transition-all">
                                <div class="p-2 border-b border-white/5 sticky top-0 bg-[#121214] z-10">
                                    <input type="text" class="w-full bg-white/5 border border-white/10 rounded px-2 py-1.5 text-xs text-gray-200 focus:outline-none focus:border-indigo-500/50" placeholder="Search port...">
                                </div>
                                <div class="max-h-48 overflow-y-auto custom-scrollbar p-1 options-list">
                                    <!-- Options populated by JS -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="h-8 border-l border-dashed border-gray-700 ml-[-18px]"></div>

                    <div class="relative group">
                        <div class="absolute -left-[21px] top-2 w-2 h-2 rounded-full bg-cyan-500 ring-4 ring-black"></div>
                        <label class="block text-[10px] font-semibold text-cyan-400 uppercase mb-1">Destination Point</label>
                        
                        <!-- Custom Dropdown: Destination -->
                        <div class="relative mb-2" id="dest-dropdown">
                            <button type="button" class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white text-left flex justify-between items-center focus:outline-none focus:border-cyan-500 focus:glow-border-blue transition group-hover:border-white/20">
                                <span class="selected-text truncate">Select Country...</span>
                                <svg class="w-4 h-4 text-gray-500 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div class="hidden absolute z-50 w-full mt-1 bg-[#121214] border border-white/10 rounded-lg shadow-xl shadow-black/50 backdrop-blur-xl overflow-hidden transform origin-top transition-all">
                                <div class="p-2 border-b border-white/5 sticky top-0 bg-[#121214] z-10">
                                    <input type="text" class="w-full bg-white/5 border border-white/10 rounded px-2 py-1.5 text-xs text-gray-200 focus:outline-none focus:border-cyan-500/50" placeholder="Search country...">
                                </div>
                                <div class="max-h-48 overflow-y-auto custom-scrollbar p-1 options-list">
                                    <!-- Options populated by JS -->
                                </div>
                            </div>
                            <input type="hidden" id="dest-country" value="">
                        </div>

                        <!-- Custom Dropdown: Destination Port -->
                        <div class="relative mb-2" id="dest-port-dropdown">
                            <button type="button" class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-gray-400 text-left flex justify-between items-center focus:outline-none focus:border-cyan-500 transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                                <span class="selected-text truncate">Select Port/Hub...</span>
                                <svg class="w-4 h-4 text-gray-500 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div class="hidden absolute z-50 w-full mt-1 bg-[#121214] border border-white/10 rounded-lg shadow-xl shadow-black/50 backdrop-blur-xl overflow-hidden transform origin-top transition-all">
                                <div class="p-2 border-b border-white/5 sticky top-0 bg-[#121214] z-10">
                                    <input type="text" class="w-full bg-white/5 border border-white/10 rounded px-2 py-1.5 text-xs text-gray-200 focus:outline-none focus:border-cyan-500/50" placeholder="Search port...">
                                </div>
                                <div class="max-h-48 overflow-y-auto custom-scrollbar p-1 options-list">
                                    <!-- Options populated by JS -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="pt-4 mt-4 border-t border-white/5">
                        <label class="block text-[10px] font-semibold text-gray-500 uppercase mb-1">Base Currency</label>
                        <select id="currency" class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-sm text-white">
                            <option value="USD">USD ($)</option>
                            <option value="EUR">EUR (€)</option>
                            <option value="INR">INR (₹)</option>
                            <option value="GBP">GBP (£)</option>
                        </select>
                    </div>
                </div>

                <button id="btn-analyze" class="w-full mt-6 py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg shadow-lg shadow-indigo-500/20 transition-all active:scale-95 flex items-center justify-center gap-2 group">
                    <span>INITIATE ANALYSIS</span>
                    <svg class="w-4 h-4 group-hover:translate-x-1 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>
        </div>

        <!-- CENTER PANEL: Holographic Map (6 Cols) -->
        <div class="col-span-6 glass-panel rounded-2xl relative overflow-hidden flex flex-col border-none shadow-[0_0_50px_rgba(0,0,0,0.5)]">
            <div class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20 pointer-events-none z-20"></div>
            
            <!-- Map Header -->
            <div class="absolute top-4 left-4 z-30">
                <div class="px-3 py-1 bg-black/60 backdrop-blur rounded border border-white/10 text-[10px] font-mono text-cyan-400">
                    LIVE SATELLITE FEED
                </div>
            </div>

            <!-- Globe Container -->
            <div id="globe-container" class="flex-grow bg-black relative z-10">
                <!-- Three.js Globe will render here -->
            </div>
            
            <!-- Map Footer Overlay -->
            <div class="absolute bottom-0 left-0 right-0 h-24 bg-gradient-to-t from-black via-black/80 to-transparent z-30 flex items-end p-6">
                <div class="w-full flex justify-between items-end">
                    <div class="text-xs text-gray-500 font-mono">
                        LAT: <span id="disp-lat">--.--</span> <br>
                        LNG: <span id="disp-lng">--.--</span>
                    </div>
                    <div class="flex gap-2">
                        <div class="h-1 w-12 bg-indigo-500 animate-pulse"></div>
                        <div class="h-1 w-8 bg-cyan-500 animate-pulse delay-75"></div>
                        <div class="h-1 w-4 bg-purple-500 animate-pulse delay-150"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: Intelligence Feed (3 Cols) -->
        <div class="col-span-3 flex flex-col gap-6 h-full">
            
            <!-- Risk Gauge -->
            <div class="glass-panel p-6 rounded-xl flex flex-col items-center justify-center relative overflow-hidden min-h-[200px]">
                <div class="absolute inset-0 bg-gradient-to-br from-indigo-500/10 to-transparent"></div>
                
                <!-- Placeholder for Gauge (CSS Circle) -->
                <div class="relative w-32 h-32 mb-4">
                    <svg class="w-full h-full transform -rotate-90">
                        <circle cx="64" cy="64" r="56" stroke="currentColor" stroke-width="8" fill="transparent" class="text-gray-800" />
                        <circle id="score-ring" cx="64" cy="64" r="56" stroke="currentColor" stroke-width="8" fill="transparent" class="text-indigo-500 transition-all duration-1000 ease-out" stroke-dasharray="351" stroke-dashoffset="351" stroke-linecap="round" />
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span id="score-val" class="text-4xl font-bold text-white glow-text">--</span>
                        <span class="text-[10px] text-gray-400 uppercase tracking-widest">Risk</span>
                    </div>
                </div>
                
                <div id="score-label" class="px-3 py-1 rounded-full bg-white/5 border border-white/10 text-xs font-bold text-gray-400">
                    AWAITING INPUT
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="glass-panel p-5 rounded-xl flex-grow flex flex-col gap-4">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest border-b border-white/5 pb-2">Mission Parameters</h3>
                
                <div class="space-y-4 flex-grow">
                    <div>
                        <div class="flex justify-between text-xs text-gray-500 mb-1">ESTIMATED COST</div>
                        <div id="stat-cost" class="text-2xl font-mono text-white font-bold tracking-tight opacity-50">$0.00</div>
                    </div>
                    <div>
                        <div class="flex justify-between text-xs text-gray-500 mb-1">TRANSIT TIME</div>
                        <div id="stat-time" class="text-2xl font-mono text-white font-bold tracking-tight opacity-50">0 Days</div>
                    </div>
                    <div>
                        <div class="flex justify-between text-xs text-gray-500 mb-1">DISTANCE</div>
                        <div id="stat-dist" class="text-lg font-mono text-gray-300 font-medium opacity-50">0 km</div>
                    </div>
                </div>

                <button id="btn-save-route" disabled class="w-full py-3 rounded border border-emerald-500/30 text-emerald-500 font-bold hover:bg-emerald-500 hover:text-white transition disabled:opacity-20 disabled:cursor-not-allowed">
                    ALLOCATE ROUTE
                </button>
            </div>
        </div>

    </main>

    <script type="module" src="/src/js/app.js"></script>
    <script type="module" src="/src/js/shipment-planner.js"></script>
</body>
</html>
